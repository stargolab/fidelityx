# roda lint e testes em todo PR e em todo push na main
name: CI

on:
  pull_request:
  push:
    branches: [main]

# um push novo no mesmo PR cancela a rodada anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.1 e a versao minima do projeto; 8.3 garante que nada quebra nas versoes novas
        php: ['8.1', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # o bootstrap dos testes recria o banco fidelityx_test a partir do database/schema.sql
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root
      DB_NAME: fidelityx_test

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, curl
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      # sem .env de proposito: a aplicacao precisa subir so com as variaveis de ambiente do job,
      # como em producao (docker). se alguem voltar a exigir o arquivo, os testes de fluxo quebram aqui.
      - name: Checagem de sintaxe (php -l)
        run: find src views public tests bin -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Testes (PHPUnit)
        run: vendor/bin/phpunit

      - name: Testes das mascaras (JavaScript)
        run: node tests/js/masks.test.js

      - name: Testes do envio de formulario (JavaScript)
        run: node tests/js/forms.test.js

  # o public/js/masks.js e versionado e gerado do src/ts/masks.ts: se alguem mexer no .ts e esquecer
  # de rodar o tsc (ou editar o .js na mao), o compilado deixa de bater com o fonte e o job falha.
  mascaras:
    name: masks.js compilado
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # versao fixa do compilador: versao diferente pode gerar um .js diferente sem ninguem ter mexido no .ts
      - name: Compilar src/ts com o tsconfig.json do projeto
        run: npx --yes -p typescript@5.8.3 tsc

      - name: Conferir se o compilado bate com o versionado
        run: |
          if ! git diff --exit-code -- public/js; then
            echo "::error::public/js/masks.js nao bate com src/ts/masks.ts. Rode 'tsc' e inclua o arquivo gerado no commit."
            exit 1
          fi
          # arquivo novo gerado pelo tsc e ainda nao versionado tambem conta
          if [ -n "$(git status --porcelain -- public/js)" ]; then
            echo "::error::o tsc gerou arquivo em public/js que nao esta versionado."
            git status --porcelain -- public/js
            exit 1
          fi