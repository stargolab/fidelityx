; ajustes de producao do fidelityx (por cima do php.ini-production da imagem)

; nao anuncia a versao do php
expose_php = Off

; erro nunca aparece na tela: vai pro log. sem "error_log" definido o php escreve na saida de erro
; do apache, que na imagem oficial e a saida do container (docker compose logs app).
; para gravar em arquivo, defina a variavel LOG_FILE (ver docs/operacao.md).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; sessoes num volume proprio: trocar o container (deploy) nao desloga os lojistas
session.save_path = /var/lib/php/sessions
